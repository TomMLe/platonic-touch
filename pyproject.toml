[project]
name = "platonic-touch"
version = "0.1.0"
description = "Do touch encoders converge with vision and language? Testing the Platonic Representation Hypothesis on tactile data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.31; sys_platform == 'darwin'",  # Apple-only; CI on Linux skips it
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2.0",
]

# On Linux (CI), pull the small CPU-only PyTorch wheels instead of the multi-GB CUDA ones.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platonic_touch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
